name: OpenCode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: opencode-${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  opencode:
    if: |
      github.event.comment.user.type == 'User' &&
      github.event.comment.user.login == github.repository_owner &&
      (github.event_name != 'pull_request_review_comment' ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      (
        contains(github.event.comment.body, '/oc') ||
        contains(github.event.comment.body, '/opencode')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      pull-requests: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Authorize command target
        id: target
        timeout-minutes: 1
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          result-encoding: string
          script: |
            const authorizeCommand = require('./scripts/opencode-command-policy.cjs');
            const allowed = await authorizeCommand({ github, context });
            if (!allowed) core.notice('Command ignored: untrusted author, unsupported command or fork PR.');
            return allowed;

      - name: Install pinned OpenCode
        if: steps.target.outputs.result == 'true'
        timeout-minutes: 1
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.10.19
          working_directory: ${{ runner.temp }}
          install_args: opencode@1.19.5

      - name: Run OpenCode
        if: steps.target.outputs.result == 'true'
        timeout-minutes: 12
        env:
          MODEL: opencode/big-pickle
          MENTIONS: /oc,/opencode
          USE_GITHUB_TOKEN: "false"
          GH_TOKEN: ${{ github.token }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_PERMISSION: '{"external_directory":{"*":"deny","${{ runner.temp }}/_github_workflow/*":"allow"},"doom_loop":"deny","question":"deny","plan_enter":"deny","plan_exit":"deny","read":{"*.env":"deny","*.env.*":"deny","*.env.example":"allow"}}'
          OPENCODE_CONFIG_CONTENT: '{"model":"opencode/big-pickle","small_model":"opencode/big-pickle","agent":{"title":{"disable":true}}}'
        run: timeout -k 10s 600s mise exec opencode@1.19.5 -- opencode github run < /dev/null
