name: Regression evidence

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string
      test_file:
        description: Regression test (tests/name.test.ts)
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: regression-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  regression:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout trusted runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve PR and preserve runner
        id: target
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require('node:fs');
            const { target } = require('./scripts/review-policy.cjs');
            const pr = await target({ github, context });
            for (const [key, value] of Object.entries(pr)) core.setOutput(key, String(value));
            fs.copyFileSync('scripts/regression-evidence.mjs', `${process.env.RUNNER_TEMP}/regression-evidence.mjs`);

      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.target.outputs.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Install toolchain
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.10.19

      - name: Install dependencies
        run: mise run install

      - name: Prove regression fails on base and passes on head
        timeout-minutes: 8
        env:
          BASE_SHA: ${{ steps.target.outputs.baseSha }}
          REVIEW_SHA: ${{ steps.target.outputs.sha }}
          TEST_FILE: ${{ inputs.test_file }}
          PR_NUMBER: ${{ steps.target.outputs.number }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVIDENCE_DIR: ${{ runner.temp }}/regression-evidence
        run: timeout -k 10s 420s mise exec -- node "$RUNNER_TEMP/regression-evidence.mjs"

      - name: Verify head is still current
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          PR_NUMBER: ${{ steps.target.outputs.number }}
          REVIEW_SHA: ${{ steps.target.outputs.sha }}
        with:
          script: |
            const fs = require('node:fs');
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: Number(process.env.PR_NUMBER) });
            if (pr.head.sha !== process.env.REVIEW_SHA || pr.state !== 'open') {
              const file = `${process.env.RUNNER_TEMP}/regression-evidence/report.json`;
              const report = JSON.parse(fs.readFileSync(file, 'utf8'));
              report.status = 'stale';
              report.currentSha = pr.head.sha;
              fs.writeFileSync(file, JSON.stringify(report, null, 2));
              fs.writeFileSync(`${process.env.RUNNER_TEMP}/regression-evidence/report.md`, `OUTDATED: checked ${process.env.REVIEW_SHA}; current ${pr.head.sha}.`);
              core.setFailed('PR changed; repeat the regression check for the new head.');
            }

      - name: Save regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: regression-${{ steps.target.outputs.number || inputs.pr_number }}-${{ steps.target.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/regression-evidence/
          if-no-files-found: ignore
          retention-days: 14
