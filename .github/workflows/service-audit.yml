name: Service accessibility audit

on:
  schedule:
    - cron: "47 2 * * *"
  workflow_dispatch:
    inputs:
      model:
        description: Free model for this manual run (no automatic fallback)
        type: choice
        required: false
        default: opencode/big-pickle
        options:
          - opencode/big-pickle
          - opencode/mimo-v2.6-flash-free
      exercise:
        description: Use a clearly marked synthetic finding instead of building the service
        type: boolean
        default: false

permissions: {}

concurrency:
  group: service-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
    env:
      SERVICE_AUDIT_EXERCISE: ${{ inputs.exercise || false }}
    steps:
      - name: Checkout trusted main event SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install toolchain
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.10.19
          install_args: node@24.22.2 pnpm@12.18.0 opencode@1.19.5
      - name: Use the server port configured in mise
        run: |
          server_port="$(mise exec -- node -p 'process.env.PORT')"
          printf 'APP_URL=http://127.0.0.1:%s/\n' "$server_port" >> "$GITHUB_ENV"
      - name: Build Call Calendar at the audit SHA
        if: inputs.exercise != true
        timeout-minutes: 5
        run: |
          pnpm install --frozen-lockfile
          mise run build
      - name: Measure the local homepage with Lighthouse
        if: inputs.exercise != true
        timeout-minutes: 4
        run: |
          mkdir -p "$RUNNER_TEMP/audit"
          NODE_ENV=production mise exec -- node dist/server/main.js > "$RUNNER_TEMP/audit/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 10 --retry-connrefused \
            --retry-delay 1 --retry-max-time 15 --max-time 2 "${APP_URL}api/health" > /dev/null
          timeout -k 10s 180s npx --yes --package lighthouse@13.6.0 lighthouse "$APP_URL" \
            --only-categories=accessibility --output=json \
            --output-path="$RUNNER_TEMP/audit/lighthouse.json" --no-enable-error-reporting \
            --chrome-flags="--headless"
      - name: Collect Lighthouse snapshot and issue inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/audit.mjs collect service "$RUNNER_TEMP/audit"
      - name: Analyze read-only snapshot
        timeout-minutes: 8
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          AUDIT_MODEL: ${{ inputs.model || 'opencode/big-pickle' }}
        run: mise exec opencode@1.19.5 -- node scripts/audit.mjs analyze service "$RUNNER_TEMP/audit"
      - name: Write Actions summary
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/audit/report.md"; then
            cat "$RUNNER_TEMP/audit/report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            mkdir -p "$RUNNER_TEMP/audit"
            echo 'Error: audit setup failed; inspect workflow logs.' | tee "$RUNNER_TEMP/audit/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save analysis and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: service-audit-report
          path: ${{ runner.temp }}/audit/
          retention-days: 30
          if-no-files-found: error

  publish:
    needs: audit
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout trusted publisher code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install toolchain
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.10.19
          install_args: node@24.22.2
      - name: Download data only from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: service-audit-report
          path: ${{ runner.temp }}/audit
      - name: Publish deterministic decisions
        env:
          GH_TOKEN: ${{ github.token }}
        run: timeout -k 10s 600s node scripts/audit.mjs publish service "$RUNNER_TEMP/audit"
      - name: Write publication summary
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/audit/report.md"; then
            cat "$RUNNER_TEMP/audit/report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            mkdir -p "$RUNNER_TEMP/audit"
            echo 'Error: publisher setup failed; inspect workflow logs.' | tee "$RUNNER_TEMP/audit/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save publication decisions even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: service-audit-publication
          path: |
            ${{ runner.temp }}/audit/report.md
            ${{ runner.temp }}/audit/decisions.json
            ${{ runner.temp }}/audit/error.json
          retention-days: 30
          if-no-files-found: error
